################################################################################
#  CI/CD Pipeline — منظومة العمل الخيري الذكي
#  يعمل عند: push أو pull_request على فرع main
#
#  الخطوات:
#    1. backend-tests   — pytest للنواة + اختبارات التكامل عبر API
#    2. frontend-build  — npm lint + npm build (Next.js)
#    3. docker-push     — بناء صور Docker ودفعها (فقط عند push على main)
#
#  GitHub Secrets المطلوبة (Settings → Secrets and variables → Actions):
#    DOCKERHUB_USERNAME  — اسم المستخدم في Docker Hub
#    DOCKERHUB_TOKEN     — رمز الوصول من Docker Hub
################################################################################

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION:  "3.11"
  NODE_VERSION:    "18"
  REGISTRY:        docker.io
  IMAGE_BACKEND:   ${{ secrets.DOCKERHUB_USERNAME }}/scs-backend
  IMAGE_FRONTEND:  ${{ secrets.DOCKERHUB_USERNAME }}/scs-frontend

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  #  JOB 1: Backend Tests (pytest)
  # ════════════════════════════════════════════════════════════════════════════
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run core unit tests (tests.py)
        run: python tests.py
        env:
          PYTHONIOENCODING: utf-8
          JWT_SECRET_KEY: ci-test-secret-do-not-use-in-production

      - name: Run API integration tests (backend/tests/)
        run: pytest backend/tests/ -v --tb=short --no-header
        env:
          PYTHONPATH: .
          JWT_SECRET_KEY: ci-test-secret-do-not-use-in-production

  # ════════════════════════════════════════════════════════════════════════════
  #  JOB 2: Frontend Build & Lint (Next.js)
  # ════════════════════════════════════════════════════════════════════════════
  frontend-build:
    name: ⚡ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-saas/package-lock.json

      - name: Install dependencies
        working-directory: frontend-saas
        run: npm ci --frozen-lockfile

      - name: Lint
        working-directory: frontend-saas
        run: npm run lint
        continue-on-error: true   # لا يوقف الـ pipeline على تحذيرات الـ lint

      - name: Build (Next.js standalone)
        working-directory: frontend-saas
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: frontend-saas/.next/standalone/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  #  JOB 3: Docker Build & Push (فقط عند push على main)
  # ════════════════════════════════════════════════════════════════════════════
  docker-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context:     .
          file:        backend/Dockerfile
          push:        true
          tags:        ${{ steps.meta-backend.outputs.tags }}
          labels:      ${{ steps.meta-backend.outputs.labels }}
          cache-from:  type=gha
          cache-to:    type=gha,mode=max

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context:     ./frontend-saas
          file:        frontend-saas/Dockerfile
          push:        true
          tags:        ${{ steps.meta-frontend.outputs.tags }}
          labels:      ${{ steps.meta-frontend.outputs.labels }}
          cache-from:  type=gha
          cache-to:    type=gha,mode=max
          build-args: |
            BACKEND_URL=http://backend:8000
